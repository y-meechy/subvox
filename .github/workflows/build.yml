name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Subvox.xcodeproj -scheme Subvox \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            test 2>&1 | tee xcodebuild.log
      - name: Report errors as annotations
        if: failure()
        run: |
          grep -E "error:|failed \(|XCTAssert|Testing failed|BUILD FAILED|TEST FAILED" xcodebuild.log \
            | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line//$'\n'/ }"
            done
          tail -25 xcodebuild.log | while IFS= read -r line; do echo "::warning::$line"; done
